<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Exercício Pseudo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>

    <section class="bloco">
      <h2>Caixa vazia</h2>

    <section class="bloco">
